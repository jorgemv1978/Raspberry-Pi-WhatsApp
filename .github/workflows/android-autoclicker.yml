name: Build AutoClicker APK

on:
  push:
    paths:
      - 'android-autoclicker/**'
      - '.github/workflows/android-autoclicker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-autoclicker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-apk
          path: android-autoclicker/app/build/outputs/apk/release/*.apk
